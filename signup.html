<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 100px;
    }

    h1 {
        font-size: 60px;
        color: #7ab8ff;
        text-shadow: 0 0 20px #1e90ff;
        margin-bottom: 40px;
    }

    .signup-box {
        width: 420px;
        padding: 30px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;
        border-radius: 12px;
        box-shadow: 0 0 25px #1e90ff;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 12px 0;
        border-radius: 8px;
        border: 2px solid #1e90ff;
        background: #0a0f1a;
        color: #d7e9ff;
        font-size: 18px;
        outline: none;
    }

    .btn {
        display: block;
        margin-top: 20px;
        padding: 12px;
        background: rgba(30, 144, 255, 0.25);
        border: 2px solid #1e90ff;
        border-radius: 10px;
        color: #7ab8ff;
        font-size: 22px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 0 15px #1e90ff;
    }

    .btn:hover {
        background: rgba(30, 144, 255, 0.4);
        transform: scale(1.05);
    }
</style>
</head>
<body>

<h1>SIGN UP</h1>

<div class="signup-box">
    <input id="firstName" type="text" placeholder="First Name">
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <label style="font-size: 18px;">Profile Picture:</label>
    <input id="pfp" type="file" accept="image/*">

    <button class="btn" onclick="createAccount()">Create Account</button>
</div>

<script>
function createAccount() {
    const firstName = document.getElementById("firstName").value;
    const pfpFile = document.getElementById("pfp").files[0];

    if (!firstName || !pfpFile) {
        alert("Enter your name and choose a profile picture.");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        localStorage.setItem("firstName", firstName);
        localStorage.setItem("pfp", e.target.result);
        localStorage.setItem("xp", 0);
        localStorage.setItem("currentQuest", "No quest selected.");
        window.location.href = "start.html";
    };
    reader.readAsDataURL(pfpFile);
}
</script>

</body>
</html>
