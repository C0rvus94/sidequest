<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 120px;
    }

    h1 {
        font-size: 50px;
        color: #7ab8ff;
        text-shadow: 0 0 20px #1e90ff;
        margin-bottom: 40px;
    }

    .pfp-wrapper {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        position: relative;
        margin-bottom: 30px;
    }

    .pfp-wrapper::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: conic-gradient(
            #1e90ff,
            #4aa3ff,
            #7ab8ff,
            #4aa3ff,
            #1e90ff
        );
        animation: spin 4s linear infinite;
        filter: blur(8px);
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .pfp {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        z-index: 2;
        object-fit: cover;
        border: 3px solid #1e90ff;
    }
</style>
</head>
<body>

<h1 id="welcomeText">Welcome</h1>

<div class="pfp-wrapper">
    <img id="pfpImage" class="pfp">
</div>

<script>
    const name = localStorage.getItem("firstName");
    const pfp = localStorage.getItem("pfp");

    document.getElementById("welcomeText").innerText = "Welcome, " + name;
    document.getElementById("pfpImage").src = pfp;
</script>

</body>
</html>
