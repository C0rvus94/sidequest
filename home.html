<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
    }

    /* SIDEBAR */
    .sidebar {
        width: 230px;
        height: 100vh;
        background: rgba(10, 15, 25, 0.9);
        border-right: 2px solid #1e90ff;
        box-shadow: 0 0 25px #1e90ff;
        display: flex;
        flex-direction: column;
        padding-top: 40px;
        position: fixed;
        left: 0;
        top: 0;
    }

    .sidebar h2 {
        text-align: center;
        color: #7ab8ff;
        margin-bottom: 40px;
        text-shadow: 0 0 15px #1e90ff;
    }

    .nav-btn {
        padding: 18px;
        margin: 10px 20px;
        background: rgba(30, 144, 255, 0.15);
        border: 2px solid #1e90ff;
        border-radius: 10px;
        color: #7ab8ff;
        font-size: 22px;
        text-decoration: none;
        text-align: center;
        transition: 0.2s;
    }

    .nav-btn:hover {
        background: rgba(30, 144, 255, 0.35);
        transform: scale(1.05);
    }

    /* MAIN CONTENT */
    .content {
        margin-left: 260px;
        padding: 60px;
        width: 100%;
        text-align: center;
    }

    .pfp-wrapper {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        position: relative;
        margin: 0 auto 30px auto;
    }

    .pfp-wrapper::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: conic-gradient(#1e90ff, #4aa3ff, #7ab8ff, #4aa3ff, #1e90ff);
        animation: spin 4s linear infinite;
        filter: blur(8px);
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .pfp {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        z-index: 2;
        object-fit: cover;
        border: 3px solid #1e90ff;
        position: relative;
    }

    h1 {
        font-size: 50px;
        color: #7ab8ff;
        text-shadow: 0 0 20px #1e90ff;
        margin-bottom: 20px;
    }

    .box {
        margin-top: 25px;
        padding: 20px;
        width: 400px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;
        border-radius: 12px;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 0 20px #1e90ff;
    }

    .box h2 {
        margin-top: 0;
        color: #7ab8ff;
    }

    .xp-bar {
        width: 100%;
        height: 20px;
        background: #0a0f1a;
        border: 2px solid #1e90ff;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    #xpFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #1e90ff, #7ab8ff);
        box-shadow: 0 0 15px #1e90ff;
        transition: 0.4s;
    }
</style>
</head>
<body>

<div class="sidebar">
    <h2>MENU</h2>
    <a class="nav-btn" href="home.html">Home</a>
    <a class="nav-btn" href="sidequest.html">SideQuest</a>
    <a class="nav-btn" href="progress.html">Progress</a>
    <a class="nav-btn" href="upgrades.html">Upgrades</a>
    <a class="nav-btn" href="social.html">Social</a>
    <a class="nav-btn" href="settings.html">Settings</a>
</div>

<div class="content">

    <div class="pfp-wrapper">
        <img id="pfpImage" class="pfp">
    </div>

    <h1 id="welcomeName"></h1>

    <div class="box">
        <h2>Current Quest</h2>
        <p id="currentQuest">No quest selected.</p>
    </div>

    <div class="box">
        <h2>XP</h2>
        <div class="xp-bar">
            <div id="xpFill"></div>
        </div>
        <p id="xpText">0 XP</p>
    </div>

</div>

<script>
window.onload = () => {
    const name = localStorage.getItem("firstName") || "Player";
    const pfp = localStorage.getItem("pfp");
    const quest = localStorage.getItem("currentQuest") || "No quest selected.";
    const xp = parseInt(localStorage.getItem("xp") || "0");

    document.getElementById("welcomeName").innerText = name + "'s Profile";

    if (pfp) {
        document.getElementById("pfpImage").src = pfp;
    } else {
        // fallback placeholder if no pfp saved
        document.getElementById("pfpImage").src = "https://i.imgur.com/4ZQZ4Zy.png";
    }

    document.getElementById("currentQuest").innerText = quest;

    document.getElementById("xpText").innerText = xp + " XP";
    const percent = Math.max(0, Math.min(xp, 100));
    document.getElementById("xpFill").style.width = percent + "%";
};
</script>

</body>
</html>
