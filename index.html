<title>SideQuest Status</title>

<!-- Rajdhani font -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

    body {
        margin: 0;

        color: #d7e9ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .panel {
        width: 420px;
        padding: 25px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;

        box-shadow: 0 0 25px #1e90ff;

        font-weight: 700;
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 20px;
        font-weight: 600;
    }

    .label {
        color: #9bbce8;
    }

    .value {
        color: #ffffff;
        font-weight: 700;
    }

    .bar-container {

        background: #1a1f2b;

        margin-top: 5px;
        height: 18px;
        overflow: hidden;
    }

    .bar {

    .hp { background: #ff4d4d; }
    .mp { background: #4d7dff; }
</style>
</head>
