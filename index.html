<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SideQuest</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 80px;
    }

    h1 {
        font-size: 70px;
        color: #7ab8ff;
        letter-spacing: 4px;
        font-weight: 700;
        text-shadow: 0 0 20px #1e90ff;
        margin-bottom: 10px;
    }

    p {
        font-size: 24px;
        opacity: 0.85;
        max-width: 600px;
        margin-bottom: 50px;
    }

    .menu {
        display: flex;
        gap: 30px;
        margin-bottom: 60px;
    }

    .btn {
        padding: 14px 32px;
        background: rgba(30, 144, 255, 0.2);
        border: 2px solid #1e90ff;
        border-radius: 10px;
        color: #7ab8ff;
        font-size: 22px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
        box-shadow: 0 0 15px #1e90ff;
    }

    .btn:hover {
        background: rgba(30, 144, 255, 0.35);
        transform: scale(1.05);
        box-shadow: 0 0 25px #4aa3ff;
    }

    .hero-box {
        width: 500px;
        padding: 30px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;
        border-radius: 12px;
        box-shadow: 0 0 25px #1e90ff;
    }

    .hero-title {
        font-size: 32px;
        color: #7ab8ff;
        font-weight: 700;
        margin-bottom: 15px;
    }

    .hero-text {
        font-size: 20px;
        opacity: 0.8;
        line-height: 1.4;
    }
</style>
</head>
<body>

<h1>SideQuest</h1>
<p>Welcome. Random side quest here </p>

<div class="menu">
    <a class="btn" href="#">Start</a>
    <a class="btn" href="#">Status</a>
    <a class="btn" href="#">Quests</a>
</div>

<div class="hero-box">
    <div class="hero-title">Welcome, Chud</div>
    <div class="hero-text">
        Track your progress, complete quests, earn XP, and Your journey begins here.
      
    </div>
</div>

</body>
</html>
