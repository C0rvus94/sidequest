<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SideQuest</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 40px;
    }

    h1 {
        font-size: 60px;
        color: #7ab8ff;
        letter-spacing: 3px;
        margin-bottom: 5px;
        font-weight: 700;
        text-shadow: 0 0 15px #1e90ff;
    }

    p.subtitle {
        font-size: 22px;
        opacity: 0.8;
        margin-bottom: 40px;
    }

    .buttons {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
    }

    .btn {
        padding: 12px 28px;
        background: #1e90ff;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 20px;
        font-weight: 600;
        transition: 0.2s;
        box-shadow: 0 0 12px #1e90ff;
    }

    .btn:hover {
        background: #4aa3ff;
        transform: scale(1.05);
        box-shadow: 0 0 18px #4aa3ff;
    }

    .panel {
        width: 420px;
        padding: 25px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;
        border-radius: 12px;
        box-shadow: 0 0 25px #1e90ff;
        margin-bottom: 60px;
    }

    h2 {
        text-align: center;
        font-size: 34px;
        margin-bottom: 10px;
        color: #7ab8ff;
        letter-spacing: 1px;
        font-weight: 700;
    }

    .row {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 20px;
        font-weight: 600;
    }

    .label {
        color: #9bbce8;
    }

    .value {
        color: #ffffff;
        font-weight: 700;
    }

    .bar-container {
        width: 100%;
        background: #1a1f2b;
        border-radius: 6px;
        margin-top: 5px;
        height: 18px;
        overflow: hidden;
    }

    .bar {
        height: 100%;
    }

    .hp { background: #ff4d4d; }
    .mp { background: #4d7dff; }
</style>
</head>
<body>

<h1>SideQuest</h1>
<p class="subtitle">Your RPG‑style life tracker. Level up your goals.</p>

<div class="buttons">
    <a class="btn" href="#">Start</a>
    <a class="btn" href="#">Status</a>
    <a class="btn" href="#">Quests</a>
</div>

<div class="panel">
    <h2>STATUS</h2>

    <div class="row"><span class="label">LEVEL</span><span class="value">18</span></div>
    <div class="row"><span class="label">JOB</span><span class="value">None</span></div>
    <div class="row"><span class="label">TITLE</span><span class="value">Wolf Assassin</span></div>

    <br>

    <div class="label">HP 2220 / 2220</div>
    <div class="bar-container"><div class="bar hp" style="width:100%"></div></div>

    <div class="label" style="margin-top:10px;">MP 350 / 350</div>
    <div class="bar-container"><div class="bar mp" style="width:100%"></div></div>

    <br>

    <div class="row"><span class="label">STR</span><span class="value">48</span></div>
    <div class="row"><span class="label">AGI</span><span class="value">27</span></div>
    <div class="row"><span class="label">PER</span><span class="value">27</span></div>
    <div class="row"><span class="label">VIT</span><span class="value">27</span></div>
    <div class="row"><span class="label">INT</span><span class="value">27</span></div>

    <br>

    <div class="row"><span class="label">Available Points</span><span class="value">12</span></div>
</div>

</body>
</html>
