<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SideQuest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 22px;
            opacity: 0.8;
            max-width: 600px;
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 14px 28px;
            background: #4a4aff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #6a6aff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>SideQuest</h1>
    <p>Your personal quest hub. Track goals, complete challenges, and level up your life.</p>

    <div class="buttons">
        <a class="btn" href="#">Start</a>
        <a class="btn" href="#">Quests</a>
        <a class="btn" href="#">Profile</a>
    </div>
</body>
</html>
