<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SideQuest</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 120px;
    }

    h1 {
        font-size: 80px;
        color: #7ab8ff;
        letter-spacing: 6px;
        font-weight: 700;
        text-shadow: 0 0 25px #1e90ff;
        margin-bottom: 20px;
    }

    p.subtitle {
        font-size: 26px;
        opacity: 0.85;
        margin-bottom: 70px;
    }

    .btn {
        padding: 18px 50px;
        background: rgba(30, 144, 255, 0.15);
        border: 2px solid #1e90ff;
        border-radius: 10px;
        color: #7ab8ff;
        font-size: 30px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
        box-shadow: 0 0 15px #1e90ff;
    }

    .btn:hover {
        background: rgba(30, 144, 255, 0.35);
        transform: scale(1.05);
        box-shadow: 0 0 25px #4aa3ff;
    }
</style>
