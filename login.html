<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #05070a;
        font-family: 'Rajdhani', sans-serif;
        color: #d7e9ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 120px;
    }

    h1 {
        font-size: 60px;
        color: #7ab8ff;
        text-shadow: 0 0 20px #1e90ff;
        margin-bottom: 40px;
    }

    .login-box {
        width: 380px;
        padding: 30px;
        background: rgba(10, 15, 25, 0.85);
        border: 2px solid #1e90ff;
        border-radius: 12px;
        box-shadow: 0 0 25px #1e90ff;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 12px 0;
        border-radius: 8px;
        border: 2px solid #1e90ff;
        background: #0a0f1a;
        color: #d7e9ff;
        font-size: 18px;
        outline: none;
    }

    input:focus {
        box-shadow: 0 0 15px #1e90ff;
    }

    .btn {
        display: block;
        margin-top: 20px;
        padding: 12px;
        background: rgba(30, 144, 255, 0.25);
        border: 2px solid #1e90ff;
        border-radius: 10px;
        color: #7ab8ff;
        font-size: 22px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
        box-shadow: 0 0 15px #1e90ff;
    }

    .btn:hover {
        background: rgba(30, 144, 255, 0.4);
        transform: scale(1.05);
        box-shadow: 0 0 25px #4aa3ff;
    }

    .signup {
        margin-top: 15px;
        font-size: 18px;
        opacity: 0.8;
    }

    .signup a {
        color: #7ab8ff;
        text-decoration: none;
        font-weight: 600;
    }

    .signup a:hover {
        text-shadow: 0 0 10px #1e90ff;
    }
</style>
</head>
<body>

<h1>LOGIN</h1>

<div class="login-box">
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <a class="btn" href="start.html">Enter</a>

    <div class="signup">
        Don't have an account?  
        <a href="signup.html">Sign Up</a>
    </div>
</div>

</body>
</html>
